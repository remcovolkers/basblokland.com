name: Deploy prototype to GitHub Pages

# PROTOTYPE hosting only. Production runs on Cloudflare Pages (see docs/domain-move.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Primary: the Sanity publish webhook calls the GitHub API with {"event_type": "sanity-publish"}
  # (setup: docs/go-live.md).
  repository_dispatch:
    types: [sanity-publish]
  # Safety net: rebuild every hour, for the day the webhook is missing, its token has expired or a
  # delivery failed. It only does anything once SANITY_PROJECT_ID is set (see the build job's `if`).
  # Runs on the default branch, in UTC; minute 17 avoids the busy top of the hour.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deploy finish rather than cancel it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A scheduled run only makes sense with Sanity content; without it it would rebuild the same
    # placeholder fixtures every hour. Pushes, manual runs and the webhook always build. When this
    # job is skipped, `deploy` (which needs it) is skipped too.
    if: ${{ github.event_name != 'schedule' || vars.SANITY_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      # The GitHub Pages site is the prototype: noindex, no sitemap, "prototype" footer line.
      # Override with a repository *variable* PUBLIC_PROTOTYPE=false (Settings -> Secrets and
      # variables -> Actions -> Variables) only when this site becomes the real one.
      PUBLIC_PROTOTYPE: ${{ vars.PUBLIC_PROTOTYPE || 'true' }}
      # Optional overrides. Left unset, astro.config.ts derives https://<owner>.github.io and
      # /<repo>/ from GITHUB_REPOSITORY. These are variables, not secrets: they are public.
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
      # Content source: with a project id the build reads published content from Sanity (public
      # dataset, no token). Without it the site builds from the local placeholder fixtures.
      # Variables, not secrets: neither value is secret.
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Install, check, build and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
          # The build fails (and nothing deploys) if types, base-path rules, personal-data
          # rules or the prototype flag checks fail.
          build-cmd: npm run check && npm run test:sanity && npm run verify:src && npm run build && npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows in a PUBLIC repository after 60 days without repository
  # activity, which would silently end the hourly safety net above. Once the repo has been quiet for
  # 45+ days, this adds one empty commit (the only thing it ever commits). A push made with
  # GITHUB_TOKEN does not start another workflow run, so this cannot loop.
  keepalive:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Empty commit if the repository has been quiet for 45+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit is ${age_days} day(s) old."
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows alive (no repository activity for ${age_days} days)"
            git push
          fi
